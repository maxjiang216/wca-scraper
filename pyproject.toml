[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wca-tools"
version = "0.1.0"
description = "WCA tools: watch-list email notifier and upcoming competition top-ranked registrants report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.scripts]
wca = "wca_org.cli:main"


[tool.setuptools]
packages = ["wca_org"]

[tool.setuptools.package-dir]
"" = "src"
