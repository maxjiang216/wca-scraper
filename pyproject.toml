[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wca-psych-sheet-notifier"
version = "0.1.0"
description = "WCA psych sheet notifier - email when watched competitors are competing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[tool.setuptools]
packages = ["wca_org"]

[tool.setuptools.package-dir]
"wca_org" = "src/wca-org"
