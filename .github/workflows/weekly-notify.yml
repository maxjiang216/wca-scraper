name: Weekly psych sheet

on:
  schedule:
    # Thursday 15:00 UTC — morning Pacific (see daily-records.yml).
    - cron: "0 15 * * 4"
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Create watch list
        env:
          WATCH_LIST: ${{ secrets.WATCH_LIST }}
        run: printf '%s' "$WATCH_LIST" > watch_list.yaml

      - name: Run weekly psych sheet
        run: |
          uv run wca weekly \
            -w watch_list.yaml \
            -e "$NOTIFY_EMAIL" \
            --smtp-user "$SMTP_USER" \
            --smtp-password "$SMTP_PASSWORD" \
            --rate-limit-delay 1.5 \
            --cubing-china
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
